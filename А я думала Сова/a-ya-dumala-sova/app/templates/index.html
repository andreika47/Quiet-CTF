<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Премьера "А я думала Сова"</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(16, 22, 47, 0.7), rgba(16, 22, 47, 0.85)),
          url("{{ url_for('static', filename='2026.jpeg') }}") center/cover no-repeat fixed;
        color: #f2f2f2;
      }
      .wrap {
        max-width: 980px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 100%;
        max-width: 820px;
        text-align: center;
        background: rgba(13, 18, 40, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        padding: 28px 24px 36px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.9rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .subtitle {
        margin: 0 0 22px;
        color: rgba(242, 242, 242, 0.85);
      }
      .timer {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .unit {
        background: linear-gradient(180deg, #1e2854, #151c3f);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 10px 26px rgba(0, 0, 0, 0.35);
        padding: 16px 10px 14px;
      }
      .value {
        display: block;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        font-weight: 700;
        line-height: 1.1;
        color: #f7f2ff;
        letter-spacing: 0.06em;
        text-shadow: 0 0 20px rgba(181, 194, 255, 0.35);
      }
      .label {
        display: block;
        margin-top: 6px;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgba(224, 229, 255, 0.75);
      }
      @media (max-width: 760px) {
        .timer {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Обратный отсчет до премьеры</h1>
        <p class="subtitle">До выхода нового мультфильма осталось</p>
        <div
          id="countdown"
          class="timer"
          data-total-seconds="{{ countdown.days * 86400 + countdown.hours * 3600 + countdown.minutes * 60 + countdown.seconds }}"
        >
          <div class="unit">
            <span class="value" data-part="days">{{ countdown.days }}</span>
            <span class="label">дней</span>
          </div>
          <div class="unit">
            <span class="value" data-part="hours">{{ countdown.hours }}</span>
            <span class="label">часов</span>
          </div>
          <div class="unit">
            <span class="value" data-part="minutes">{{ countdown.minutes }}</span>
            <span class="label">минут</span>
          </div>
          <div class="unit">
            <span class="value" data-part="seconds">{{ countdown.seconds }}</span>
            <span class="label">секунд</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      function splitCountdown(totalSeconds) {
        return {
          days: Math.floor(totalSeconds / 86400),
          hours: Math.floor((totalSeconds % 86400) / 3600),
          minutes: Math.floor((totalSeconds % 3600) / 60),
          seconds: totalSeconds % 60,
        };
      }

      function renderCountdown(root, totalSeconds) {
        const value = splitCountdown(totalSeconds);
        root.querySelector('[data-part="days"]').textContent = value.days;
        root.querySelector('[data-part="hours"]').textContent = String(value.hours).padStart(2, "0");
        root.querySelector('[data-part="minutes"]').textContent = String(value.minutes).padStart(2, "0");
        root.querySelector('[data-part="seconds"]').textContent = String(value.seconds).padStart(2, "0");
      }

      const node = document.getElementById("countdown");
      let totalSeconds = Number.parseInt(node.dataset.totalSeconds, 10) || 0;

      renderCountdown(node, totalSeconds);
      setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds -= 1;
          renderCountdown(node, totalSeconds);
        }
      }, 1000);
    </script>
  </body>
</html>
