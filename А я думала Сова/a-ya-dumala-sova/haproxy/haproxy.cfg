global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend cartoon_front
    mode http
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/challenge.pem alpn h2,http/1.1
    unique-id-format %[uuid()]
    unique-id-header X-Unique-ID

    http-request set-var(txn.coraza.app) str(sova_app)

    filter spoe engine coraza config /usr/local/etc/haproxy/coraza.cfg
    http-request send-spoe-group coraza coraza-req

    http-request deny deny_status 403 if { var(txn.coraza.action) -m str deny }
    default_backend cartoon_app

backend cartoon_app
    mode http
    server app app:8000 check

backend coraza-spoa
    mode tcp
    option spop-check
    timeout connect 5s
    timeout server 3m
    server coraza coraza-spoa:9000 check
