name: box-without-cat-server

services:
  box-without-cat-server:
    image: box-without-cat-server:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      FLAG: "${FLAG:-CTF{THIS_IS_FAKE_FLAG}}"
      VAULT_SECRET: "${VAULT_SECRET:-0x2a5}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
