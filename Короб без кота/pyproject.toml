[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-vault-ctf"
version = "1.0.0"
description = "A Qualtran, Cirq and qsim quantum-circuit optimization CTF challenge"
requires-python = ">=3.12"
dependencies = [
  "cirq-core>=1.4,<2",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "qsimcirq==0.22.0",
  "qualtran==0.7.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["box-without-cat/challenge", "server"]

[tool.hatch.build.targets.wheel.sources]
"box-without-cat/challenge" = "challenge"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "box-without-cat"]
addopts = "-q"
