<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Voting Forum</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="site-wrap stack">
        <header class="forum-banner">
            <div>
                <h1>НОВЫЙ ПОЛЬЗОВАТЕЛЬ</h1>
                <p class="tagline">зарегистрируйтесь для публикации идеи</p>
            </div>
            <div class="pixel-logo" aria-hidden="true"><div class="pixel-sprite"></div></div>
        </header>

        <nav class="topbar">
            <span class="muted">ваш ник</span>
            <form method="GET" action="/">
                <button class="button-ghost" type="submit">Вернуться на форум</button>
            </form>
        </nav>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <section class="panel">
            <div class="panel-head"><h2>Регистрация</h2></div>
            <div class="panel-body">
                <form method="POST" action="/register">
                    <label class="field">
                        <span>Логин</span>
                        <input name="username" type="text" placeholder="username">
                    </label>
                    <label class="field">
                        <span>Пароль</span>
                        <input name="password" type="password" placeholder="password">
                    </label>
                    <div class="actions-inline">
                        <button type="submit">Регистрация</button>
                    </div>
                </form>
                <form method="GET" action="/login" style="margin-top:12px;">
                    <button class="button-ghost" type="submit">Уже есть аккаунт</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
